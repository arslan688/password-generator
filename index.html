<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link href="./src/output.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <script src="https://kit.fontawesome.com/2ef3355b6b.js" crossorigin="anonymous"></script>
</head>

<body class="bg-linear-to-tr from-[#9FA0A8] to-[#5C7852] text-white">
    <div class="h-screen flex flex-col items-center justify-center">
        <h1 class="text-2xl md:text-3xl text-[#ffffff] font-bold p-6">
            Password Generator
        </h1>
        <div
            class="text-xs md:text-xl flex flex-col md:w-1/3 p-6 bg-linear-to-br from-[#283c86] to-[#45a247] border border-cyan-800 rounded-xl inset-shadow">
            <div class="flex items-center my-1 border border-cyan-800 rounded-xs ">
                <input class="basis-full p-2 min-w-0 outline-none" id="show-pwd" disabled type="text"
                    placeholder="Generate your Password...">
                <button class="px-3 py-2 shrink-0 flex items-center justify-center" data-tooltip="Copy to clipboard!"
                    href="" id="copy-btn">
                    <i class="fa-regular fa-copy" id="copy-btn"></i>
                </button>
            </div>
            <input type="range" name="range" id="range" min="4" max="24" value="8">
            <div class="flex my-1">
                <label class="basis-full" for="range">Password Length :</label>
                <span id="range-number"></span>
            </div>

            <div class="flex my-2 text-xs ">
                <label class="basis-full" for="lowercase">Include Lowercase Letters (a - z)</label>
                <input class="w-5 h-4" type="checkbox" checked name="lowercase" id="lowercase">
            </div>

            <div class="flex my-2 text-xs ">
                <label class="basis-full" for="uppercase">Include Uppercase Letters (A - Z)</label>
                <input class="w-5 h-4" type="checkbox" checked name="uppercase" id="uppercase">
            </div>

            <div class="flex my-2 text-xs ">
                <label class="basis-full" for="numbers">Include Numbers (0 - 9)</label>
                <input class="w-5 h-4" type="checkbox" checked name="numbers" id="numbers">
            </div>

            <div class="flex my-2 text-xs ">
                <label class="basis-full" for="symbols">Include Symbols (@ - *)</label>
                <input class="w-5 h-4" type="checkbox" checked name="symbols" id="symbols">
            </div>

            <button class="border-0 rounded-xl bg-[#005FCC] text-xl p-2 my-2" type="button" id="generate-pwd">Generate
                Password</button>
            <span id="error"></span>
        </div>
    </div>
    <script src="./src/script.js"></script>
</body>

</html>
